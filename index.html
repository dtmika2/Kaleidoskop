<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope Pattern Match Demo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e27;
    --accent: #ff8a3d;
    --text: #eceef2;
    --muted: #8b90a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; max-width: 420px; }

  .stage-wrap {
    position: relative;
    width: 420px;
    height: 420px;
  }
  .stage {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='%23ff8a3d' stroke='%23000000' stroke-opacity='0.55' stroke-width='1.5'/></svg>") 10 10, pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.5);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .glow-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    pointer-events: none;
    border: 3px solid var(--ring-color, var(--accent));
    box-shadow: 0 0 24px 4px var(--ring-glow, rgba(255,138,61,0.55));
    opacity: 0;
    transition: opacity 0.15s linear, border-color 0.2s linear, box-shadow 0.2s linear;
  }

  .target-box {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 18px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .target-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .target-item .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .target-item .sub {
    font-size: 10px;
    color: var(--muted);
  }
  .target-thumb {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--item-color, var(--accent)), 0 0 14px var(--item-glow, rgba(255,138,61,0.35));
    transition: box-shadow 0.2s linear, filter 0.2s linear;
  }
  .target-thumb canvas { display: block; width: 100%; height: 100%; }
  .target-item.found .target-thumb {
    filter: saturate(1.3);
    box-shadow: 0 0 0 3px var(--item-color, var(--accent)), 0 0 20px var(--item-glow, rgba(255,138,61,0.6));
  }

  .hud {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .meter {
    width: 220px;
    height: 8px;
    border-radius: 4px;
    background: #2a2e3a;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4a4f5e, var(--ring-color, var(--accent)));
    transition: width 0.12s linear, background 0.2s linear;
  }
  .meter-label { font-size: 12px; color: var(--muted); min-width: 70px; }

  .word-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 14%;
    pointer-events: none;
    z-index: 5;
    gap: 2px;
  }
  .word-overlay .letter {
    font-family: "Book Antiqua", Palatino, "Palatino Linotype", serif;
    font-size: 39px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--ring-color, var(--accent));
    text-shadow: 0 0 26px var(--ring-glow, rgba(255,138,61,0.95)), 0 0 12px rgba(0,0,0,1), 0 4px 8px rgba(0,0,0,0.95), 0 10px 22px rgba(0,0,0,0.85);
    opacity: 0;
    transform: translateY(var(--curve-y, 0px)) scale(0.7);
    transition: opacity 0.4s ease, transform 0.4s ease, color 0.2s linear;
  }
  .word-overlay .letter.lit {
    opacity: 1;
    transform: translateY(var(--curve-y, 0px)) scale(1);
  }

  .ref-box {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .ref-box span { font-size: 12px; color: var(--muted); }
  .ref-frame {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.5);
  }
  .ref-frame canvas { display: block; width: 100%; height: 100%; }
  .ref-marker {
    position: absolute;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 10px rgba(255,138,61,0.9);
    pointer-events: none;
    transition: left 0.05s linear, top 0.05s linear;
  }
</style>
</head>
<body>

  <h1>Elementární Kaleidoskop</h1>
  <p class="sub">Pohybuj kurzorem po kruhu. Najdi čtyři skryté vzory - oheň, země, voda a vítr. Přibliž se k nim a začnou se odhalovat písmena jejich slov.</p>

  <div class="target-box" id="targetBox"><!-- 4 target-item entries injected by JS --></div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="kal" width="420" height="420"></canvas>
      <div class="word-overlay" id="wordOverlay"><!-- letters injected per active pattern --></div>
    </div>
    <div class="glow-ring" id="ring"></div>
  </div>

  <div class="hud">
    <span class="meter-label">Blízkost k odhalení</span>
    <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
  </div>

  <div class="ref-box">
    <span>Obrazec elementů na který kaleidoskop hledí</span>
    <div class="ref-frame">
      <canvas id="refCanvas" width="220" height="220"></canvas>
      <div class="ref-marker" id="refMarker"></div>
    </div>
  </div>

<script>
/* ---------- 1. Load the source texture (the uploaded artwork) ---------- */
const SRC_SIZE = 900; // matches the embedded image's native size
const src = document.createElement('canvas');
src.width = src.height = SRC_SIZE;
const sctx = src.getContext('2d');

let sourceReady = false;
const sourceImg = new Image();
sourceImg.onload = function () {
  sctx.drawImage(sourceImg, 0, 0, SRC_SIZE, SRC_SIZE);
  sourceReady = true;
  drawKaleidoscope();
  buildLegend();
  updateMatch();

  // draw the whole, unmirrored source image once into the reference panel
  const refCanvas = document.getElementById('refCanvas');
  const rctx = refCanvas.getContext('2d');
  rctx.drawImage(sourceImg, 0, 0, refCanvas.width, refCanvas.height);
  updateRefMarker();
};
sourceImg.src = '4ElementalCorners.png';

/* ---------- 2. Kaleidoscope renderer: N mirrored/rotated wedges around a shared pan ---------- */
const canvas = document.getElementById('kal');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;
const RADIUS = W / 2;
const SLICES = 10; // matches the "many-slice" look of the original site

let pan = { x: SRC_SIZE / 2, y: SRC_SIZE / 2 }; // current pan center into src texture

function renderKaleidoscope(targetCanvas, panVal, sampleRadius) {
  if (!sourceReady) return;
  const tctx = targetCanvas.getContext('2d');
  const tw = targetCanvas.width, th = targetCanvas.height;
  const tcx = tw / 2, tcy = th / 2;
  const tRadius = tw / 2;
  // sampleRadius = how many source-image pixels the visible radius should
  // span. Defaults to the canvas's own radius (1:1, no zoom change). Pass
  // the main view's RADIUS here for a smaller preview canvas so it shows
  // the same field of view, just scaled down to fit.
  const sr = sampleRadius || tRadius;
  const scaleFactor = tRadius / sr;
  tctx.clearRect(0, 0, tw, th);
  const sliceAngle = (Math.PI * 2) / SLICES;
  const pattern = tctx.createPattern(src, 'repeat'); // tiles infinitely -> no edge/wall

  for (let i = 0; i < SLICES; i++) {
    tctx.save();
    tctx.translate(tcx, tcy);
    tctx.rotate(i * sliceAngle);
    if (i % 2 === 1) tctx.scale(1, -1); // mirror every other wedge
    tctx.scale(scaleFactor, scaleFactor); // match the main view's zoom level

    tctx.beginPath();
    tctx.moveTo(0, 0);
    tctx.arc(0, 0, sr, -sliceAngle / 2, sliceAngle / 2);
    tctx.closePath();
    tctx.clip();

    tctx.translate(-panVal.x, -panVal.y);
    tctx.fillStyle = pattern;
    tctx.fillRect(panVal.x - sr, panVal.y - sr, sr * 2, sr * 2);
    tctx.restore();
  }
}

function drawKaleidoscope() {
  renderKaleidoscope(canvas, pan);
}
drawKaleidoscope();

/* ---------- 3. Hover handling: absolute position mapping, no drag needed ---------- */
const stage = document.getElementById('stage');

// The stage element is assumed to share the source image's aspect ratio,
// so its bounding box maps 1:1 onto the full image: hovering at the stage's
// left edge = the image's left edge, top edge = the image's top edge, etc.
// No relative deltas, no accumulation, no walls to hit.
stage.addEventListener('pointermove', e => {
  const rect = stage.getBoundingClientRect();
  let nx = (e.clientX - rect.left) / rect.width;  // 0..1 across the stage
  let ny = (e.clientY - rect.top) / rect.height;
  nx = Math.min(1, Math.max(0, nx));
  ny = Math.min(1, Math.max(0, ny));
  pan.x = nx * SRC_SIZE;
  pan.y = ny * SRC_SIZE;
  drawKaleidoscope();
  updateMatch();
  updateRefMarker();
  scheduleIdleReset();
});

// After 20s with no pointer movement, drift back to the center so the
// kaleidoscope doesn't stay stuck wherever the cursor last was.
const IDLE_RESET_MS = 20000;
let idleTimer = null;
function scheduleIdleReset() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    pan.x = SRC_SIZE / 2;
    pan.y = SRC_SIZE / 2;
    drawKaleidoscope();
    updateMatch();
    updateRefMarker();
  }, IDLE_RESET_MS);
}
scheduleIdleReset();

function updateRefMarker() {
  const marker = document.getElementById('refMarker');
  // pan.x / pan.y are in source-texture units (0..SRC_SIZE) -> convert to
  // a 0..100% position on the reference panel, which shows the same image.
  const pctX = (pan.x / SRC_SIZE) * 100;
  const pctY = (pan.y / SRC_SIZE) * 100;
  marker.style.left = pctX + '%';
  marker.style.top = pctY + '%';
}

/* ---------- 4. Pattern matching: four simultaneous hidden patterns, one per "category" ---------- */
// Each pattern lives at its own spot in the source image and unlocks its own
// word, in its own color, as you get close to it. Only the pattern you're
// currently closest to (and reasonably near) is "active" -- its word appears
// in the circle, its color drives the ring/meter, and its legend thumb glows.
const PATTERNS = [
  { id: 'Oheň',  word: 'Zrcadlo',  color: '#ff8a3d', glow: 'rgba(255,138,61,0.55)', target: { x: 444, y: 370 } },
  { id: 'Země', word: 'Jeskyně',  color: '#7cc36a', glow: 'rgba(124,195,106,0.55)', target: { x: 738, y: 481 } },
  { id: 'Voda', word: 'Spirála', color: '#4aa8f0', glow: 'rgba(74,168,240,0.55)',  target: { x: 158, y: 608 } },
  { id: 'Vzduch',  word: 'Kyvadlo',  color: '#9fd0d6', glow: 'rgba(159,208,214,0.55)', target: { x: 72, y: 231 } },
];
const TOLERANCE = 45;        // px radius counted as "fully matched"
const REVEAL_START = 0.90;   // proximity at which the first letters appear
const REVEAL_FULL  = 0.98;   // proximity at which the whole word is visible
const ACTIVE_THRESHOLD = 0.05; // below this proximity, no pattern is "active" (overlay stays empty)

// Build a "diametrically opposite" reveal order: pair each letter with the
// one exactly half the word-length away (i <-> i+len/2), like opposite points
// on a circle. Reveal starts one step in from that seam and saves the pair
// containing the true first letter (and, for odd lengths, the true last
// letter) for last. E.g. for "Kalamita" (len 8): [1,5,2,6,3,7,0,4] -- "a i",
// "l t", "a a", then "K m" last.
function genRevealOrder(len) {
  if (len <= 1) return len === 1 ? [0] : [];
  const half = Math.floor(len / 2);
  const order = [];
  for (let i = 1; i < half; i++) {
    order.push(i, i + half);
  }
  order.push(0, half);
  if (len % 2 === 1) order.push(len - 1);
  return order;
}
PATTERNS.forEach(p => {
  p.revealOrder = genRevealOrder(p.word.length);
  p.found = false;
});

const ring = document.getElementById('ring');
const meterFill = document.getElementById('meterFill');
const wordOverlay = document.getElementById('wordOverlay');
let activePatternId = null; // which pattern's letters are currently rendered in the overlay

const DEFAULT_CURSOR_COLOR = '#ff8a3d';
let cursorColor = null; // tracks the last color applied, so we only touch style.cursor on change
function setCursorDotColor(hex) {
  if (hex === cursorColor) return;
  cursorColor = hex;
  stage.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='${encodeURIComponent(hex)}' stroke='%23000000' stroke-opacity='0.55' stroke-width='1.5'/></svg>") 10 10, pointer`;
}

function buildLegend() {
  const box = document.getElementById('targetBox');
  box.innerHTML = '';
  PATTERNS.forEach(p => {
    const item = document.createElement('div');
    item.className = 'target-item';
    item.id = 'legend-' + p.id;
    item.style.setProperty('--item-color', p.color);
    item.style.setProperty('--item-glow', p.glow);

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'target-thumb';
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    canvas.id = 'thumb-' + p.id;
    thumbWrap.appendChild(canvas);

    const label = document.createElement('div');
    label.className = 'label';
    label.style.color = p.color;
    label.textContent = p.id[0].toUpperCase() + p.id.slice(1);

    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.id = 'sub-' + p.id;
    sub.textContent = 'nalezni';

    item.appendChild(thumbWrap);
    item.appendChild(label);
    item.appendChild(sub);
    box.appendChild(item);

    renderKaleidoscope(canvas, p.target, RADIUS);
  });
}

function setActivePattern(pattern) {
  if (activePatternId === (pattern ? pattern.id : null)) return;
  activePatternId = pattern ? pattern.id : null;
  wordOverlay.innerHTML = '';
  if (!pattern) return;
  const letters = Array.from(pattern.word);
  const mid = (letters.length - 1) / 2 || 1;
  const CURVE_AMPLITUDE = 14; // px, "slight" U-shaped sag toward the center letters
  letters.forEach((ch, idx) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.dataset.idx = idx;
    span.textContent = ch;
    const t = (idx - (letters.length - 1) / 2) / mid;
    const curveY = CURVE_AMPLITUDE * (1 - t * t);
    span.style.setProperty('--curve-y', curveY.toFixed(1) + 'px');
    wordOverlay.appendChild(span);
  });
}

function updateWordReveal(pattern, proximity) {
  const len = pattern.word.length;
  let revealedCount;
  if (proximity >= REVEAL_FULL) {
    revealedCount = len;
  } else if (proximity >= REVEAL_START) {
    const t = (proximity - REVEAL_START) / (REVEAL_FULL - REVEAL_START);
    revealedCount = Math.min(len, 2 + Math.floor(t * (len - 2)));
  } else {
    revealedCount = 0;
  }
  const litIndices = new Set(pattern.revealOrder.slice(0, revealedCount));
  Array.from(wordOverlay.querySelectorAll('.letter')).forEach(el => {
    const idx = Number(el.dataset.idx);
    el.classList.toggle('lit', litIndices.has(idx));
  });
}

function updateMatch() {
  // Find whichever pattern the cursor is currently closest to.
  let best = null, bestProximity = -1, bestDist = Infinity;
  PATTERNS.forEach(p => {
    const dist = Math.hypot(pan.x - p.target.x, pan.y - p.target.y);
    const proximity = Math.max(0, 1 - dist / 500);
    if (proximity > bestProximity) {
      bestProximity = proximity;
      bestDist = dist;
      best = p;
    }
    if (dist <= TOLERANCE && !p.found) {
      p.found = true;
      const sub = document.getElementById('sub-' + p.id);
      const item = document.getElementById('legend-' + p.id);
      if (sub) sub.textContent = 'Nalezeno!';
      if (item) item.classList.add('found');
    }
  });

  if (best && bestProximity >= ACTIVE_THRESHOLD) {
    setActivePattern(best);
    // Set the color vars on a shared ancestor (stage-wrap) so both the ring
    // (a sibling of .stage) and the word-overlay letters (inside .stage)
    // pick them up via inheritance -- setting them only on #ring left the
    // letters stuck on the default accent color.
    const stageWrap = document.querySelector('.stage-wrap');
    stageWrap.style.setProperty('--ring-color', best.color);
    stageWrap.style.setProperty('--ring-glow', best.glow);
    meterFill.style.setProperty('--ring-color', best.color);
    meterFill.style.width = (bestProximity * 100).toFixed(0) + '%';
    ring.style.opacity = bestProximity > 0.15 ? (bestProximity * 0.9).toFixed(2) : 0;
    updateWordReveal(best, bestProximity);
    setCursorDotColor(best.color);
  } else {
    setActivePattern(null);
    meterFill.style.width = '0%';
    ring.style.opacity = 0;
    setCursorDotColor(DEFAULT_CURSOR_COLOR);
  }
}
updateMatch();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
