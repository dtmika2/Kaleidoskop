<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope Circle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #12141a;
    --accent: #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage-wrap {
    position: relative;
    width: 94vmin;
    height: 94vmin;
  }
  .stage {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='%23ff8a3d' stroke='%23000000' stroke-opacity='0.55' stroke-width='1.5'/></svg>") 10 10, pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.5);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .glow-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    pointer-events: none;
    border: 3px solid var(--ring-color, var(--accent));
    box-shadow: 0 0 24px 4px var(--ring-glow, rgba(255,138,61,0.55));
    opacity: 0;
    transition: opacity 0.15s linear, border-color 0.2s linear, box-shadow 0.2s linear;
  }

  /* Virtual cursor shown while the pointer is locked (see pointer-lock JS) --
     the real OS cursor is hidden then, so this dot is the only visual cursor. */
  /* Only ever needed as a stand-in for an OS cursor hidden by Pointer Lock.
     Nothing hides it now, so the dot would sit alongside the real cursor and
     disagree with it after a drift. */
  .cursor-dot {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.55), 0 0 10px rgba(255,138,61,0.9);
    pointer-events: none;
    z-index: 4;
    display: none;
  }

  /* Build stamp. The service worker can serve a page from cache, so "is the
     fix even running?" is otherwise unanswerable from inside the app. */
  /* Tapping the badge toggles the readout: there is no keyboard on a tablet,
     which is where this actually needs to be read. Padded out to a finger-sized
     target, sitting outside .stage-wrap so it never reaches the stage. */
  .build-badge {
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 10;
    margin: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(0,0,0,0.55);
    font: 13px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.5px;

    user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .build-badge.on { color: #ff8a3d; background: rgba(0,0,0,0.8); }


  /* Diagnostics for the pointer-lock behaviour; toggled by tapping the badge. */
  .debug-panel {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 10;
    margin: 0;
    padding: 8px 10px;
    max-width: 92vw;
    border-radius: 6px;
    background: rgba(0,0,0,0.86);
    color: #bfe6c0;
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;

    white-space: pre;
    pointer-events: none;
    user-select: none;
    display: none;
  }

  .word-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 14%;
    pointer-events: none;
    z-index: 5;
    gap: 2px;
  }
  .word-overlay .letter {
    font-family: "Book Antiqua", Palatino, "Palatino Linotype", serif;
    font-size: clamp(36px, 9.1vmin, 94px);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--ring-color, var(--accent));
    text-shadow: 0 0 26px var(--ring-glow, rgba(255,138,61,0.95)), 0 0 12px rgba(0,0,0,1), 0 4px 8px rgba(0,0,0,0.95), 0 10px 22px rgba(0,0,0,0.85);
    opacity: 0;
    transform: translateY(var(--curve-y, 0px)) scale(0.7);
    transition: opacity 0.4s ease, transform 0.4s ease, color 0.2s linear;
  }
  .word-overlay .letter.lit {
    opacity: 1;
    transform: translateY(var(--curve-y, 0px)) scale(1);
  }
</style>
</head>
<body>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <canvas id="kal" width="420" height="420"></canvas>
      <div class="word-overlay" id="wordOverlay"><!-- letters injected per active pattern --></div>
    </div>
    <div class="glow-ring" id="ring"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>
  <div class="build-badge" id="buildBadge"></div>
  <pre class="debug-panel" id="debugPanel"></pre>

<script>
/* ---------- 0. Build stamp and pointer diagnostics ---------- */
// Bump BUILD on every change that gets pushed. It is shown in the corner so a
// cached page can be told apart from a fresh one from inside the installed app.
const BUILD = 'b28';
document.getElementById('buildBadge').textContent = BUILD;

// Counters, not logs: the question is which code path handles movement while
// the pointer is locked, and whether the lock is actually holding.
const dbg = {
  absMoves: 0,
  hoverMoves: 0,
  dragMoves: 0,
  buttons: 0,
  drifts: 0,
  lastHandler: '-',
  lastType: '-',       // pointerType of the last move: mouse, touch or pen
  mvx: 0, mvy: 0,
  clientX: 0, clientY: 0,
  events: [],
};


function dbgEvent(text) {
  dbg.events.unshift(Math.round(performance.now() / 100) / 10 + 's ' + text);
  if (dbg.events.length > 6) dbg.events.length = 6;
}

const debugPanel = document.getElementById('debugPanel');
const buildBadge = document.getElementById('buildBadge');
let debugVisible = false;

function toggleDebug() {
  debugVisible = !debugVisible;
  debugPanel.style.display = debugVisible ? 'block' : 'none';
  buildBadge.classList.toggle('on', debugVisible);
}

// Tap the badge (tablet) or press D (desktop).
buildBadge.addEventListener('click', toggleDebug);
window.addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') toggleDebug();
});


setInterval(() => {
  if (!debugVisible) return;
  debugPanel.textContent = [
    'build     ' + BUILD,
    'display   ' + (matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen'
                  : matchMedia('(display-mode: standalone)').matches ? 'standalone (bars show)'
                  : 'browser tab') + (document.fullscreenElement ? ' +api' : ''),
    'input     ' + dbg.lastType + '   touchpts ' + (navigator.maxTouchPoints || 0),
    'handler   ' + dbg.lastHandler,

    'moves     hover ' + dbg.hoverMoves + '   pressed ' + dbg.dragMoves + '   buttons ' + dbg.buttons,
    'anchor    ' + Math.round(anchor.x) + ', ' + Math.round(anchor.y) + '   cap ' + Math.round(MAX_ANCHOR),
    'slack     ' + Math.round(slack.x) + ', ' + Math.round(slack.y)
                 + '   washes over ' + Math.round(SLACK_WASH_DISTANCE),
    'movement  ' + dbg.mvx + ', ' + dbg.mvy,
    'client    ' + Math.round(dbg.clientX) + ', ' + Math.round(dbg.clientY),
    'pan       ' + Math.round(pan.x) + ', ' + Math.round(pan.y),
    'drifts    ' + dbg.drifts,
    '',
  ].concat(dbg.events).join('\n');
}, 100);

/* ---------- 1. Load the source texture ---------- */
const SRC_SIZE = 900; // matches the embedded image's native size
const src = document.createElement('canvas');
src.width = src.height = SRC_SIZE;
const sctx = src.getContext('2d');

let sourceReady = false;
const sourceImg = new Image();
sourceImg.onload = function () {
  sctx.drawImage(sourceImg, 0, 0, SRC_SIZE, SRC_SIZE);
  sourceReady = true;
  drawKaleidoscope();
  updateMatch();
};
sourceImg.src = '4ElementalCorners.png';

/* ---------- 2. Kaleidoscope renderer: N mirrored/rotated wedges around a shared pan ---------- */
const canvas = document.getElementById('kal');
const W = canvas.width, H = canvas.height;
const RADIUS = W / 2;
const SLICES = 10; // matches the "many-slice" look of the original site

let pan = { x: SRC_SIZE / 2, y: SRC_SIZE / 2 }; // current pan center into src texture

function renderKaleidoscope(targetCanvas, panVal, sampleRadius) {
  if (!sourceReady) return;
  const tctx = targetCanvas.getContext('2d');
  const tw = targetCanvas.width, th = targetCanvas.height;
  const tcx = tw / 2, tcy = th / 2;
  const tRadius = tw / 2;
  const sr = sampleRadius || tRadius;
  const scaleFactor = tRadius / sr;
  tctx.clearRect(0, 0, tw, th);
  const sliceAngle = (Math.PI * 2) / SLICES;
  const pattern = tctx.createPattern(src, 'repeat'); // tiles infinitely -> no edge/wall

  for (let i = 0; i < SLICES; i++) {
    tctx.save();
    tctx.translate(tcx, tcy);
    tctx.rotate(i * sliceAngle);
    if (i % 2 === 1) tctx.scale(1, -1); // mirror every other wedge
    tctx.scale(scaleFactor, scaleFactor); // match the main view's zoom level

    tctx.beginPath();
    tctx.moveTo(0, 0);
    tctx.arc(0, 0, sr, -sliceAngle / 2, sliceAngle / 2);
    tctx.closePath();
    tctx.clip();

    tctx.translate(-panVal.x, -panVal.y);
    tctx.fillStyle = pattern;
    tctx.fillRect(panVal.x - sr, panVal.y - sr, sr * 2, sr * 2);
    tctx.restore();
  }
}

function drawKaleidoscope() {
  renderKaleidoscope(canvas, pan, RADIUS);
}

/* ---------- 3. Hover handling: absolute position mapping, no drag needed ---------- */
const stage = document.getElementById('stage');

// Keep the canvas's internal resolution matched to its displayed size (which
// tracks 100vmin, so it fills to the edges on any device/orientation) times
// devicePixelRatio, so the render stays sharp instead of being CSS-stretched
// from a fixed small bitmap.
// Each frame repaints SLICES full-size wedges of a tiled 900x900 pattern, so
// cost grows with the square of this number. Uncapped, an installed PWA on a
// high-DPI screen asks for a ~2000px canvas -- standalone has no tab strip or
// URL bar, so 94vmin is larger than in a tab -- and the repaint could not keep
// up with the mouse. Capping trades sharpness nobody can see for a frame rate
// the pointer can ride on.
const MAX_CANVAS_PX = 1400;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(MAX_CANVAS_PX, Math.round(stage.clientWidth * dpr));
  if (size > 0 && canvas.width !== size) {
    canvas.width = size;
    canvas.height = size;
    drawKaleidoscope();
  }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resizeCanvas();
drawKaleidoscope();

const cursorDot = document.getElementById('cursorDot');

// No Pointer Lock. b16-b23 measured it on this tablet and it does not work
// here: it drops itself unprompted, and around ninety percent of the movement
// delivered under it cancels out. Without it the OS cursor cannot be relocated
// by the app, so the idle drift to center is undone by the next real movement
// landing back at the pointer's old physical spot. That is a real cost, and it
// is the one b12's anchor was invented to cover. The anchor is back below,
// capped this time so it cannot put the rim out of reach.
//
// cursorDot existed to stand in for the OS cursor while the lock hid it. With
// nothing hiding it, the styled CSS cursor is the indicator and the dot is
// hidden in CSS, so the two cannot disagree after a drift.

function updateCursorDotPosition() {
  cursorDot.style.left = (pan.x / SRC_SIZE) * 100 + '%';
  cursorDot.style.top = (pan.y / SRC_SIZE) * 100 + '%';
}

function applyCssCursor(hex) {
  stage.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='${encodeURIComponent(hex)}' stroke='%23000000' stroke-opacity='0.55' stroke-width='1.5'/></svg>") 10 10, pointer`;
}

// Gain keeps the real pointer away from the edges of the screen. The circle is
// 94vmin, so on a landscape tablet it is 94% of the screen height, and mapping
// it 1:1 meant reaching the top of the circle required the pointer to be within
// a few percent of the top of the screen -- far enough into Android's reveal
// zone to pull the system bars down over the app. At a gain of 1.6 the pointer
// covers the whole circle from within the middle ~62% of the screen.
const POINTER_GAIN = 1.6;

// The anchor is what makes a drift stick. No web API can relocate the real
// pointer, so rather than moving it, the mapping moves under it: while the view
// glides to center, the anchor is held equal to (pan - pointer), so at every
// instant the pointer's physical spot already means wherever the view now sits.
// Whether the drift finishes or someone grabs the trackball halfway through,
// movement resumes from there with nothing to jump.
//
// Uncapped -- as it was from b12 to b18 -- that is precisely what put part of
// the rim out of reach: with an offset in force the pointer would have to leave
// the screen to make up the difference, so pushing straight at one side stopped
// short, while coming at the same spot indirectly (which washed the anchor out
// on the way) arrived. The fault was never the re-anchoring; it was that
// nothing bounded it.
//
// The gain is what pays for it. Mapped at gain G about the center, the
// pointer's physical range covers pan from half*(1-G) to half*(1+G), which
// overshoots the circle by SRC_SIZE*(G-1)/2 on each side. That overshoot is
// exactly the headroom an offset can be made up from, so an anchor capped to it
// can always be pushed through, and an anchor larger than it never can. At
// gain 1.6 that is 30% of the circle's width -- well over what a drift needs.
const MAX_ANCHOR = SRC_SIZE * (POINTER_GAIN - 1) / 2;

// It washes out with travel as well, so the offset fades with use rather than
// on a clock: someone standing still never has the view slide out from under
// them, and a sweep or two clears it entirely.
const ANCHOR_WASH_DISTANCE = SRC_SIZE * 1.5;

let anchor = { x: 0, y: 0 };
let lastBase = { x: SRC_SIZE / 2, y: SRC_SIZE / 2 }; // last pointer pos, stage coords

// Coordinates outside the stage map outside 0..SRC_SIZE quite happily; they get
// clamped back onto the circle afterwards.
function baseFromEvent(e) {
  const rect = stage.getBoundingClientRect();
  const half = SRC_SIZE / 2;
  const x = ((e.clientX - rect.left) / rect.width) * SRC_SIZE;
  const y = ((e.clientY - rect.top) / rect.height) * SRC_SIZE;
  return {
    x: half + (x - half) * POINTER_GAIN, // scaled about the circle's center, so
    y: half + (y - half) * POINTER_GAIN, // the middle still maps to the middle
  };
}

// The anchor cannot carry more than MAX_ANCHOR, but a drift can easily need
// more: the offset it asks for is (centre - pointer), and the pointer is
// gain-mapped, so at the edge of the screen it wants 720 against a cap of 270.
// b26 dropped that remainder, and dropping it is what made the view jump on the
// first movement after a drift.
//
// It is held in slack instead. At the instant movement resumes, anchor + slack
// together come to exactly what the drift asked for, so there is nothing to
// jump; the slack then eases to zero over a few hundred milliseconds and the
// mapping settles onto the pointer. The displacement still has to go -- the cap
// is what keeps the rim reachable, and it is not negotiable -- but it leaves as
// visible motion rather than as a discontinuity.
// Washed out by how far the pointer travels, not on a clock. A timed glide
// (b27) cleared in half a second while dragging the view a third of the way
// across the circle on its own -- correct, and still read as a lurch, because
// the motion was the app's rather than the visitor's. Spent against travel
// instead, the same correction happens inside a movement they are already
// making, which the eye takes as their own doing.
//
// It washes over a shorter distance than the anchor: the slack sits outside the
// cap, so while it is in force the rim it points away from is not yet
// reachable, and it wants to be gone within the first sweep rather than the
// second. Nothing drives it but movement, so a visitor who never touches the
// trackball simply keeps the centred view, which is the point of the drift.
// 0.35 measured against how far you have to pull back before the rim on the
// far side comes within reach again, after a worst-case drift with the pointer
// parked at the screen edge:
//
//   wash 0.60  retreat 180px: short by 102   retreat 280px: short by 18
//   wash 0.45  retreat 180px: short by  58   retreat 280px: reached
//   wash 0.35  retreat 180px: short by  23   retreat 280px: reached
//   wash 0.25  retreat 180px: reached        retreat 280px: reached
//
// Below 0.35 the correction starts to be spent over so little travel that it is
// b27's lurch again, merely charged to the visitor's hand instead of a timer.
// Some retreat is unavoidable: with the pointer against the edge of the screen
// there is no room left to push, whatever the numbers say.
const SLACK_WASH_DISTANCE = SRC_SIZE * 0.35;
let slack = { x: 0, y: 0 };

// The single place pan is derived from the pointer. The move handler and the
// slack glide both go through it, so they cannot disagree about the mapping.
function applyMapping() {
  pan.x = lastBase.x + anchor.x + slack.x;
  pan.y = lastBase.y + anchor.y + slack.y;
  clampPanToCircle();
  requestDraw();
}

function capAnchor() {
  const dist = Math.hypot(anchor.x, anchor.y);
  if (dist > MAX_ANCHOR) {
    const scale = MAX_ANCHOR / dist;
    anchor.x *= scale;
    anchor.y *= scale;
  }
}

// The stage is a circle inscribed in its square bounding box, so the movable
// area is a circle of radius SRC_SIZE/2 around the box's center -- clamping
// pan to the square (as before) let the cursor wander into the box's
// corners, visibly outside the ring. All 4 pattern targets sit within this
// radius, so they stay reachable.
function clampPanToCircle() {
  const cx = SRC_SIZE / 2, cy = SRC_SIZE / 2;
  const dx = pan.x - cx, dy = pan.y - cy;
  const dist = Math.hypot(dx, dy);
  const maxR = SRC_SIZE / 2;
  if (dist > maxR) {
    const scale = maxR / dist;
    pan.x = cx + dx * scale;
    pan.y = cy + dy * scale;
  }
}

// On window for the same reason, and because a press that lands outside the
// box otherwise left the readout showing "input -" with no way to tell a
// dead device from an unlistened corner of the page.
// The manifest asks for display: fullscreen, which hides Android's bars. An
// install still carrying an older manifest comes up merely standalone, and for
// that the Fullscreen API gets to the same place -- but only from inside a user
// gesture, so the first press is where it has to be asked for. Never attempted
// in a browser tab, where taking the whole screen unasked would be obnoxious.
function enterFullscreenIfStandalone() {
  if (!matchMedia('(display-mode: standalone)').matches) return;
  if (document.fullscreenElement) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    const p = req.call(el, { navigationUI: 'hide' });
    if (p && typeof p.catch === 'function') p.catch(() => {});
    dbgEvent('fullscreen requested');
  } catch (err) {
    dbgEvent('fullscreen failed');
  }
}

window.addEventListener('pointerdown', e => {
  dbg.lastType = e.pointerType;
  dbgEvent('down (' + e.pointerType + ')');
  enterFullscreenIfStandalone();
});


// A mouse reports movement far more often than the screen refreshes (125-1000
// Hz against 60-120 Hz), and every draw is a full repaint of the whole circle.
// Drawing straight from the event handler meant several full repaints per
// displayed frame, so the input queue fell behind and the dot moved in jerks --
// worst in the installed PWA, where the canvas is largest. The handler now only
// updates pan and asks for a single draw per animation frame.
let drawFrameId = null;

function renderNow() {
  drawKaleidoscope();
  updateMatch();
  updateCursorDotPosition();
}

function requestDraw() {
  if (drawFrameId !== null) return;
  drawFrameId = requestAnimationFrame(() => {
    drawFrameId = null;
    renderNow();
  });
}

// One listener, one mapping: the pointer's position on the stage is the pan,
// directly. There is no delta path and no anchor, so every point of the circle
// is reachable at every moment and nothing accumulates between events.

function trackMove() {
  cancelDrift(); // a real pointer movement always wins over the idle drift
  noteActivity();
  clampPanToCircle(); // per event, so summed deltas cannot run up a debt past the rim
  requestDraw();
}

// Listened for on window rather than the stage: the stage is a disc inside a
// square box, so movement through its corners, or over the page around it, has
// to count too -- otherwise the view sits still while the trackball is plainly
// being moved. Coordinates outside the box map outside 0..SRC_SIZE quite
// happily; clampPanToCircle puts them back on the rim afterwards.
window.addEventListener('pointermove', e => {
  dbg.absMoves++;
  if (e.buttons) dbg.dragMoves++; else dbg.hoverMoves++;
  dbg.buttons = e.buttons;
  dbg.lastHandler = 'pointermove (anchored)';
  dbg.lastType = e.pointerType;

  dbg.mvx = e.movementX; dbg.mvy = e.movementY;
  dbg.clientX = e.clientX; dbg.clientY = e.clientY;

  const base = baseFromEvent(e);
  const travel = Math.hypot(base.x - lastBase.x, base.y - lastBase.y);
  lastBase = base;

  const keep = Math.max(0, 1 - travel / ANCHOR_WASH_DISTANCE);
  anchor.x *= keep;
  anchor.y *= keep;

  const slackKeep = Math.max(0, 1 - travel / SLACK_WASH_DISTANCE);
  slack.x *= slackKeep;
  slack.y *= slackKeep;

  applyMapping();
  trackMove();
});

// After 20s with no pointer activity, glide back to the center over time
// (rather than snapping instantly) so the reset is visible as motion -- the
// next visitor sees the pattern actually settled at center, not just an
// image that happens to reset the moment they touch it.
const IDLE_RESET_MS = 20000;
const IDLE_CHECK_MS = 500;
const DRIFT_DURATION_MS = 1400;
let driftAnimId = null;
let lastActivityAt = performance.now();
let driftedSinceActivity = false;

function cancelDrift() {
  if (driftAnimId !== null) {
    cancelAnimationFrame(driftAnimId);
    driftAnimId = null;
  }
}

function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function driftToCenter() {
  dbg.drifts++;
  dbgEvent('drift to center');
  const startX = pan.x, startY = pan.y;
  const targetX = SRC_SIZE / 2, targetY = SRC_SIZE / 2;
  const startTime = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / DRIFT_DURATION_MS);
    const e = easeInOutQuad(t);
    pan.x = startX + (targetX - startX) * e;
    pan.y = startY + (targetY - startY) * e;
    // Re-anchored every frame, not just at the end: the drift can be
    // interrupted at any point, and this way the pointer's physical spot
    // already means "here" whenever movement resumes. Capped on the spot, so
    // the rim it points away from stays within the pointer's reach.
    const wantX = pan.x - lastBase.x;
    const wantY = pan.y - lastBase.y;
    anchor.x = wantX;
    anchor.y = wantY;
    capAnchor();
    // Whatever the cap refused is not thrown away, it is parked in slack, so
    // anchor + slack still add up to the drift's full displacement.
    slack.x = wantX - anchor.x;
    slack.y = wantY - anchor.y;
    renderNow();
    if (t < 1) {
      driftAnimId = requestAnimationFrame(step);
    } else {
      driftAnimId = null;
    }
  }
  driftAnimId = requestAnimationFrame(step);
}

// Idleness is measured against a timestamp polled twice a second, rather than a
// timeout torn down and recreated on every single pointer event.
function noteActivity() {
  lastActivityAt = performance.now();
  driftedSinceActivity = false;
}

// Any pointer activity in the window counts, not only movement over the circle.
// The stage is a disc inside a square box, so passing through its corners -- or
// over the page around it -- fired no stage pointermove at all, and the view
// would drift back to center while the user was still moving the mouse.
['pointermove', 'pointerdown', 'wheel', 'keydown'].forEach(type => {
  window.addEventListener(type, noteActivity, { passive: true });
});

setInterval(() => {
  if (driftedSinceActivity || driftAnimId !== null) return;
  if (performance.now() - lastActivityAt >= IDLE_RESET_MS) {
    driftedSinceActivity = true; // one drift per idle stretch, not one per check
    driftToCenter();
  }
}, IDLE_CHECK_MS);

/* ---------- 4. Pattern matching: drives the ring's color/glow and the hidden word ---------- */
const PATTERNS = [
  { id: 'Oheň',   word: 'Zrcadlo',  color: '#ff8a3d', glow: 'rgba(255,138,61,0.55)', target: { x: 444, y: 370 } },
  { id: 'Země',   word: 'Jeskyně',  color: '#7cc36a', glow: 'rgba(124,195,106,0.55)', target: { x: 738, y: 481 } },
  { id: 'Voda',   word: 'Spirála', color: '#4aa8f0', glow: 'rgba(74,168,240,0.55)',  target: { x: 158, y: 608 } },
  { id: 'Vzduch', word: 'Kyvadlo',  color: '#9fd0d6', glow: 'rgba(159,208,214,0.55)', target: { x: 72, y: 231 } },
];
const ACTIVE_THRESHOLD = 0.05; // below this proximity, no pattern is "active" (overlay stays empty)
const REVEAL_START = 0.90;   // proximity at which the first letters appear
const REVEAL_FULL  = 0.98;   // proximity at which the whole word is visible

// Build a "diametrically opposite" reveal order: pair each letter with the
// one exactly half the word-length away (i <-> i+len/2), like opposite points
// on a circle. Reveal starts one step in from that seam and saves the pair
// containing the true first letter (and, for odd lengths, the true last
// letter) for last. E.g. for "Kalamita" (len 8): [1,5,2,6,3,7,0,4] -- "a i",
// "l t", "a a", then "K m" last.
function genRevealOrder(len) {
  if (len <= 1) return len === 1 ? [0] : [];
  const half = Math.floor(len / 2);
  const order = [];
  for (let i = 1; i < half; i++) {
    order.push(i, i + half);
  }
  order.push(0, half);
  if (len % 2 === 1) order.push(len - 1);
  return order;
}
PATTERNS.forEach(p => {
  p.revealOrder = genRevealOrder(p.word.length);
});

const ring = document.getElementById('ring');
const stageWrap = document.getElementById('stageWrap');
const wordOverlay = document.getElementById('wordOverlay');
let activePatternId = null; // which pattern's letters are currently rendered in the overlay

const DEFAULT_CURSOR_COLOR = '#ff8a3d';
let cursorColor = null; // tracks the last color applied, so we only touch style.cursor on change
function setCursorDotColor(hex) {
  if (hex === cursorColor) return;
  cursorColor = hex;
  cursorDot.style.background = hex;
  cursorDot.style.boxShadow = `0 0 0 2px rgba(0,0,0,0.55), 0 0 10px ${hex}`;
  applyCssCursor(hex);
}

function setActivePattern(pattern) {
  if (activePatternId === (pattern ? pattern.id : null)) return;
  activePatternId = pattern ? pattern.id : null;
  wordOverlay.innerHTML = '';
  if (!pattern) return;
  Array.from(pattern.word).forEach((ch, idx) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.dataset.idx = idx;
    span.textContent = ch;
    wordOverlay.appendChild(span);
  });
  const letters = Array.from(wordOverlay.querySelectorAll('.letter'));
  const mid = (letters.length - 1) / 2 || 1;
  letters.forEach((span, idx) => {
    const fontSize = parseFloat(getComputedStyle(span).fontSize) || 39;
    const amplitude = fontSize * 0.36; // "slight" U-shaped sag toward the center letters
    const t = (idx - (letters.length - 1) / 2) / mid;
    const curveY = amplitude * (1 - t * t);
    span.style.setProperty('--curve-y', curveY.toFixed(1) + 'px');
  });
}

function updateWordReveal(pattern, proximity) {
  const len = pattern.word.length;
  let revealedCount;
  if (proximity >= REVEAL_FULL) {
    revealedCount = len;
  } else if (proximity >= REVEAL_START) {
    const t = (proximity - REVEAL_START) / (REVEAL_FULL - REVEAL_START);
    revealedCount = Math.min(len, 2 + Math.floor(t * (len - 2)));
  } else {
    revealedCount = 0;
  }
  const litIndices = new Set(pattern.revealOrder.slice(0, revealedCount));
  Array.from(wordOverlay.querySelectorAll('.letter')).forEach(el => {
    const idx = Number(el.dataset.idx);
    el.classList.toggle('lit', litIndices.has(idx));
  });
}

function updateMatch() {
  let best = null, bestProximity = -1;
  PATTERNS.forEach(p => {
    const dist = Math.hypot(pan.x - p.target.x, pan.y - p.target.y);
    const proximity = Math.max(0, 1 - dist / 500);
    if (proximity > bestProximity) {
      bestProximity = proximity;
      best = p;
    }
  });

  if (best && bestProximity >= ACTIVE_THRESHOLD) {
    setActivePattern(best);
    stageWrap.style.setProperty('--ring-color', best.color);
    stageWrap.style.setProperty('--ring-glow', best.glow);
    ring.style.opacity = bestProximity > 0.15 ? (bestProximity * 0.9).toFixed(2) : 0;
    updateWordReveal(best, bestProximity);
    setCursorDotColor(best.color);
  } else {
    setActivePattern(null);
    ring.style.opacity = 0;
    setCursorDotColor(DEFAULT_CURSOR_COLOR);
  }
}
updateMatch();

if ('serviceWorker' in navigator) {
  // updateViaCache: 'none' stops the browser serving sw.js itself out of its
  // HTTP cache, which is what let a stale worker survive repeated relaunches.
  // update() then forces a check on every launch rather than waiting for the
  // browser's own schedule -- this runs as a kiosk, so it is never reloaded by
  // hand and would otherwise sit on one build indefinitely.
  const hadController = !!navigator.serviceWorker.controller;
  let reloadedForUpdate = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // A new worker took over, so the page now in front of us is the old one.
    // Only on an update, never on the first install, which would loop.
    if (!hadController || reloadedForUpdate) return;
    reloadedForUpdate = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update())
      .catch(() => {});
  });
}

</script>
</body>
</html>
