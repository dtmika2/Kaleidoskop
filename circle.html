<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover says the page takes responsibility for the system UI, so
     the viewport is laid out across the whole screen and stays that size when a
     bar appears over it, instead of being inset and shrinking. The bars then
     overlay a page that has not moved, which is the whole of the problem. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleidoscope Circle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    /* Read back in the readout. With viewport-fit=cover these report how far the
       system UI intrudes on each edge, which is the measurement that was being
       taken with a ruler against the screen. */
    --sa-top: env(safe-area-inset-top, 0px);
    --sa-right: env(safe-area-inset-right, 0px);
    --sa-bottom: env(safe-area-inset-bottom, 0px);
    --sa-left: env(safe-area-inset-left, 0px);
    --bg: #12141a;
    --accent: #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    /* Holding the button to steer is a drag as far as the browser is concerned,
       and a drag over the clue letters selected them. */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Sized and placed in pixels by JS rather than in vmin, and fixed rather than
     flow-positioned, so that a transient change in viewport height moves
     nothing. See latchLayout: when Android reveals a system bar the viewport
     shrinks, and anything measured in vmin shrinks with it. */
  .stage-wrap {
    position: fixed;
    width: 94vmin;
    height: 94vmin;
    /* Centred as a proportion, not at a latched pixel offset. Fixed positioning
       is relative to the viewport, and when a system bar appears at the top the
       viewport origin moves down with it -- so a pixel offset drags the circle
       down by the height of the bar. A proportion holds still when both bars
       appear together, and is out by only half the difference when one does. */
    left: 50%;
    top: 50%;              /* overwritten in px by positionStage */
    transform: translate(-50%, -50%);
  }
  .stage {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='%23ff8a3d' stroke='%23000000' stroke-opacity='0.55' stroke-width='1.5'/></svg>") 10 10, pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.5);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .glow-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    pointer-events: none;
    border: 3px solid var(--ring-color, var(--accent));
    box-shadow: 0 0 24px 4px var(--ring-glow, rgba(255,138,61,0.55));
    opacity: 0;
    transition: opacity 0.15s linear, border-color 0.2s linear, box-shadow 0.2s linear;
  }

  /* Virtual cursor shown while the pointer is locked (see pointer-lock JS) --
     the real OS cursor is hidden then, so this dot is the only visual cursor. */
  /* Shown always. Inside the circle it is the only cursor -- the real one is
     hidden there -- and it sits at the clamped pan, so when the pointer wanders
     off the disc the dot stays on the rim and the OS cursor takes over outside.
     Two indicators, each where the other cannot go. */
  .cursor-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.55), 0 0 10px rgba(255,138,61,0.9);
    pointer-events: none;
    z-index: 4;
  }

  /* Build stamp. The service worker can serve a page from cache, so "is the
     fix even running?" is otherwise unanswerable from inside the app. */
  /* Tapping the badge toggles the readout: there is no keyboard on a tablet,
     which is where this actually needs to be read. Padded out to a finger-sized
     target, sitting outside .stage-wrap so it never reaches the stage. */
  .build-badge {
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 10;
    margin: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(0,0,0,0.55);
    font: 13px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.5px;

    user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .build-badge.on { color: #ff8a3d; background: rgba(0,0,0,0.8); }


  /* Diagnostics for the pointer-lock behaviour; toggled by tapping the badge. */
  .debug-panel {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 10;
    margin: 0;
    padding: 8px 10px;
    max-width: 92vw;
    border-radius: 6px;
    background: rgba(0,0,0,0.86);
    color: #bfe6c0;
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;

    white-space: pre;
    pointer-events: none;
    user-select: none;
    display: none;
  }

  /* The clue picture. Inside .stage so the disc clips it, above the
     kaleidoscope and below the letters at z-index 5. Centred at 44% rather than
     50% because the word sits along the bottom, and the two should not touch.
     The canvas is square; each image is fitted inside it preserving aspect,
     since the four range from 485x420 to 645x472 and none is square. */
  .clue-art {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 52%;
    height: 52%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 3;
  }

  .word-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 14%;
    pointer-events: none;
    z-index: 5;
    gap: 2px;
  }
  .word-overlay .letter {
    font-family: "Book Antiqua", Palatino, "Palatino Linotype", serif;
    font-size: clamp(36px, 9.1vmin, 94px);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--ring-color, var(--accent));
    text-shadow: 0 0 26px var(--ring-glow, rgba(255,138,61,0.95)), 0 0 12px rgba(0,0,0,1), 0 4px 8px rgba(0,0,0,0.95), 0 10px 22px rgba(0,0,0,0.85);
    opacity: 0;
    transform: translateY(var(--curve-y, 0px)) scale(0.7);
    transition: opacity 0.4s ease, transform 0.4s ease, color 0.2s linear;
  }
  .word-overlay .letter.lit {
    opacity: 1;
    transform: translateY(var(--curve-y, 0px)) scale(1);
  }
</style>
</head>
<body>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <canvas id="kal" width="420" height="420"></canvas>
      <canvas class="clue-art" id="clue" width="300" height="300"></canvas>
      <div class="word-overlay" id="wordOverlay"><!-- letters injected per active pattern --></div>
    </div>
    <div class="glow-ring" id="ring"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>
  <div class="build-badge" id="buildBadge"></div>
  <pre class="debug-panel" id="debugPanel"></pre>

<script>
/* ---------- 0. Build stamp and pointer diagnostics ---------- */
// Bump BUILD on every change that gets pushed. It is shown in the corner so a
// cached page can be told apart from a fresh one from inside the installed app.
const BUILD = 'b42';
document.getElementById('buildBadge').textContent = BUILD;

// Counters, not logs: the question is which code path handles movement while
// the pointer is locked, and whether the lock is actually holding.
const dbg = {
  absMoves: 0,
  hoverMoves: 0,
  dragMoves: 0,
  buttons: 0,
  reshuffles: 0,
  lastHandler: '-',
  lastType: '-',       // pointerType of the last move: mouse, touch or pen
  mvx: 0, mvy: 0,
  clientX: 0, clientY: 0,
  events: [],
};


// Top, right, bottom, left, as the browser reports them. Guarded because a
// stripped-down getComputedStyle -- the test harness has one -- has no
// getPropertyValue, and the readout is not worth throwing over.
function safeArea(side) {
  try {
    const cs = getComputedStyle(document.documentElement);
    if (!cs || typeof cs.getPropertyValue !== 'function') return '0px';
    return (cs.getPropertyValue('--sa-' + side) || '0px').trim();
  } catch (err) {
    return '0px';
  }
}

function safeAreaInsets() {
  return ['top', 'right', 'bottom', 'left'].map(safeArea).join('  ');
}

// Everything that could describe where the page has been put, in one line.
// viewport-fit=cover did not stop the jump, and the transient is far too quick
// to read live, so each change is written to the log to be read afterwards.
//
// The four numbers that matter: whether innerHeight moves at all (if it does,
// cover is not being honoured and the page is still being inset); whether the
// safe-area insets are reported (if they are, the split between top and bottom
// is known and the position can be corrected exactly); whether screenY moves
// (which gives the top inset on its own); and what the visual viewport says,
// since it can move independently of the layout one.
function viewportLine() {
  const vv = window.visualViewport;
  return window.innerWidth + 'x' + window.innerHeight
    + '  sa ' + safeAreaInsets()
    + '  scrY ' + (window.screenY !== undefined ? window.screenY : '?')
    + (vv ? '  vv ' + Math.round(vv.width) + 'x' + Math.round(vv.height)
            + '@' + Math.round(vv.offsetTop) : '  vv -');
}

function dbgEvent(text) {
  dbg.events.unshift(Math.round(performance.now() / 100) / 10 + 's ' + text);
  if (dbg.events.length > 6) dbg.events.length = 6;
}

const debugPanel = document.getElementById('debugPanel');
const buildBadge = document.getElementById('buildBadge');
let debugVisible = false;

function toggleDebug() {
  debugVisible = !debugVisible;
  debugPanel.style.display = debugVisible ? 'block' : 'none';
  buildBadge.classList.toggle('on', debugVisible);
}

// Tap the badge (tablet) or press D (desktop).
buildBadge.addEventListener('click', toggleDebug);
window.addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') toggleDebug();
});


setInterval(() => {
  if (!debugVisible) return;
  debugPanel.textContent = [
    'build     ' + BUILD,
    'display   ' + (matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen'
                  : matchMedia('(display-mode: standalone)').matches ? 'standalone (bars show)'
                  : 'browser tab') + (document.fullscreenElement ? ' +api' : ''),
    'input     ' + dbg.lastType + '   touchpts ' + (navigator.maxTouchPoints || 0),
    'handler   ' + dbg.lastHandler,

    'moves     hover ' + dbg.hoverMoves + '   pressed ' + dbg.dragMoves + '   buttons ' + dbg.buttons,
    'viewport  ' + viewportLine(),
    'latched   ' + (latched ? latched.vmin : '-')
                 + '   fullH ' + (latched ? latched.fullH : '-')
                 + '   top ' + (stageWrap.style.top || '-')
                 + '   via ' + insetSource,
    'rim       push ' + rimPush.toFixed(2),
    'clue      ' + (cluePattern ? cluePattern.image : '-')
                 + '   level ' + clueLevel + '/' + CLUE_LEVELS
                 + (cluePattern && !cluePattern.imageReady ? '   NOT LOADED' : ''),
    'offset    ' + Math.round(mapOffset.x) + ', ' + Math.round(mapOffset.y)
                 + (reshuffleAnimId !== null ? '   moving' : ''),
    'movement  ' + dbg.mvx + ', ' + dbg.mvy,
    'client    ' + Math.round(dbg.clientX) + ', ' + Math.round(dbg.clientY),
    'pan       ' + Math.round(pan.x) + ', ' + Math.round(pan.y),
    'reshuffle ' + dbg.reshuffles,
    '',
  ].concat(dbg.events).join('\n');
}, 100);

/* ---------- 1. Load the source texture ---------- */
const SRC_SIZE = 900; // matches the embedded image's native size
const src = document.createElement('canvas');
src.width = src.height = SRC_SIZE;
const sctx = src.getContext('2d');

let sourceReady = false;
const sourceImg = new Image();
sourceImg.onload = function () {
  sctx.drawImage(sourceImg, 0, 0, SRC_SIZE, SRC_SIZE);
  sourceReady = true;
  drawKaleidoscope();
  updateMatch();
};
sourceImg.src = '4ElementalCorners.png';

/* ---------- 2. Kaleidoscope renderer: N mirrored/rotated wedges around a shared pan ---------- */
const canvas = document.getElementById('kal');
const W = canvas.width, H = canvas.height;
const RADIUS = W / 2;
const SLICES = 10; // matches the "many-slice" look of the original site

let pan = { x: SRC_SIZE / 2, y: SRC_SIZE / 2 }; // current pan center into src texture

// What the idle reset moves, instead of moving the view. The source tiles
// infinitely, so the whole texture can be re-registered under the pointer:
// sampling happens at pan + mapOffset, and every target is shifted by the same
// amount, which leaves the puzzle exactly as hard and puts its answers
// somewhere else. pan itself is never touched by it, so the pointer mapping
// stays what it is -- which is the entire reason the anchor, the slack and the
// pointer lock can all go.
let mapOffset = { x: 0, y: 0 };

function modSrc(v) {
  return ((v % SRC_SIZE) + SRC_SIZE) % SRC_SIZE;
}

function renderKaleidoscope(targetCanvas, panVal, sampleRadius) {
  if (!sourceReady) return;
  const tctx = targetCanvas.getContext('2d');
  const tw = targetCanvas.width, th = targetCanvas.height;
  const tcx = tw / 2, tcy = th / 2;
  const tRadius = tw / 2;
  const sr = sampleRadius || tRadius;
  const scaleFactor = tRadius / sr;
  tctx.clearRect(0, 0, tw, th);
  const sliceAngle = (Math.PI * 2) / SLICES;
  const pattern = tctx.createPattern(src, 'repeat'); // tiles infinitely -> no edge/wall

  for (let i = 0; i < SLICES; i++) {
    tctx.save();
    tctx.translate(tcx, tcy);
    tctx.rotate(i * sliceAngle);
    if (i % 2 === 1) tctx.scale(1, -1); // mirror every other wedge
    tctx.scale(scaleFactor, scaleFactor); // match the main view's zoom level

    tctx.beginPath();
    tctx.moveTo(0, 0);
    tctx.arc(0, 0, sr, -sliceAngle / 2, sliceAngle / 2);
    tctx.closePath();
    tctx.clip();

    tctx.translate(-panVal.x, -panVal.y);
    tctx.fillStyle = pattern;
    tctx.fillRect(panVal.x - sr, panVal.y - sr, sr * 2, sr * 2);
    tctx.restore();
  }
}

function drawKaleidoscope() {
  renderKaleidoscope(canvas, { x: pan.x + mapOffset.x, y: pan.y + mapOffset.y }, RADIUS);
}

/* ---------- 3. Hover handling: absolute position mapping, no drag needed ---------- */
const stage = document.getElementById('stage');
// Declared here rather than with the other pattern-matching elements further
// down: latchLayout runs during load and sizes it, long before that section.
const stageWrap = document.getElementById('stageWrap');

// Keep the canvas's internal resolution matched to its displayed size (which
// tracks 100vmin, so it fills to the edges on any device/orientation) times
// devicePixelRatio, so the render stays sharp instead of being CSS-stretched
// from a fixed small bitmap.
// Each frame repaints SLICES full-size wedges of a tiled 900x900 pattern, so
// cost grows with the square of this number. Uncapped, an installed PWA on a
// high-DPI screen asks for a ~2000px canvas -- standalone has no tab strip or
// URL bar, so 94vmin is larger than in a tab -- and the repaint could not keep
// up with the mouse. Capping trades sharpness nobody can see for a frame rate
// the pointer can ride on.
const MAX_CANVAS_PX = 1400;

// Android reveals its system bars when the pointer reaches the top or bottom of
// the screen. Nothing in a web page can stop that. What a web page can stop is
// making it worse: the viewport shrinks by the height of the bar, and until b38
// every vmin in the layout shrank with it. The circle resized, the canvas was
// reallocated at a new resolution and fully repainted, and the clue field was
// rebuilt from scratch mid-reveal. The bar appearing for a moment read as the
// whole app flickering and changing resolution, which is far more alarming than
// a strip at the top of the screen.
//
// So the layout is latched. A size is adopted when the viewport grows, when the
// orientation flips, or when a smaller viewport has persisted long enough to be
// real rather than a bar passing through. A bar revealing itself now changes
// nothing at all: it simply covers the top of a page that has not moved.
const LAYOUT_SETTLE_MS = 1500;
let latched = null;           // { vmin, landscape, fullH }
let shrinkSince = 0;

// Measured on the tablet: the viewport really does shrink when a bar appears,
// 853 tall down to 775, so viewport-fit=cover is not being honoured and the page
// is still laid out inside the bars. Width does not move, so the circle keeps
// its size; only where it sits changes.
//
// Centred as a proportion, the circle lands at (top inset) + (remaining
// height)/2, which is off by (total inset)/2 - (top inset) -- around fifteen
// pixels up for a 24px status bar and a 54px navigation bar. Halved, but not
// gone. To cancel it exactly the top inset has to be known on its own, and the
// total is all the viewport gives us.
//
// Three ways to learn it, best first. The assumed share is only reached if the
// platform reports nothing at all, and it is visible in the readout so a wrong
// guess can be seen rather than felt.
const ASSUMED_TOP_SHARE = 0.31;   // a 24px status bar against a 78px total
let insetSource = '-';

function topInset(total) {
  const sa = parseFloat(safeArea('top'));
  if (sa > 0) { insetSource = 'safe-area'; return sa; }
  const sy = window.screenY;
  if (typeof sy === 'number' && sy > 0) { insetSource = 'screenY'; return sy; }
  insetSource = total > 0 ? 'assumed' : 'none';
  return total * ASSUMED_TOP_SHARE;
}

// Put the circle at the same place on the screen whatever the bars are doing:
// its centre belongs at half the un-inset height, which sits that far minus the
// top inset down from the top of the viewport we have been given.
function positionStage() {
  if (!latched) return;
  const total = Math.max(0, latched.fullH - window.innerHeight);
  const top = latched.fullH / 2 - topInset(total);
  stageWrap.style.top = Math.round(top) + 'px';
}

function flippedFrom(landscape) {
  return !latched || latched.landscape !== landscape;
}

function latchLayout(force) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const vmin = Math.min(vw, vh);
  if (!(vmin > 0)) return;
  const landscape = vw >= vh;

  if (latched && !force) {
    const flipped = landscape !== latched.landscape;
    if (vmin < latched.vmin && !flipped) {
      // Smaller. Could be a bar, could be real -- wait and see.
      if (!shrinkSince) shrinkSince = performance.now();
      if (performance.now() - shrinkSince < LAYOUT_SETTLE_MS) return;
    } else if (vmin === latched.vmin && !flipped) {
      shrinkSince = 0;
      return;
    }
  }
  shrinkSince = 0;
  // fullH is the tallest viewport seen in this orientation -- the one with no
  // bars over it, which is what the circle should stay centred in.
  const fullH = latched && !flippedFrom(landscape) ? Math.max(latched.fullH, vh) : vh;
  latched = { vmin, landscape, fullH };

  const size = Math.round(vmin * 0.94);
  stageWrap.style.width = size + 'px';
  stageWrap.style.height = size + 'px';
  positionStage();
  dbgEvent('layout ' + size + 'px');
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(MAX_CANVAS_PX, Math.round(stage.clientWidth * dpr));
  if (size > 0 && canvas.width !== size) {
    canvas.width = size;
    canvas.height = size;
    drawKaleidoscope();
  }
}
// latchLayout first: the canvas and the clue field both measure the stage, and
// they must not read it mid-change. resizeCanvas and resizeClue each return
// early when the size they read has not moved, so a bar passing through costs
// nothing beyond the check.
function onViewportChange(force) {
  latchLayout(force);
  // Even when the latch declines to adopt a transient shrink, the circle still
  // has to be pushed back to where it was -- that is the whole point.
  if (latched) {
    latched.fullH = Math.max(latched.fullH, window.innerHeight);
    positionStage();
  }
  resizeCanvas();
  resizeClue();
}
window.addEventListener('resize', () => {
  dbgEvent('vp ' + viewportLine());
  onViewportChange(false);
});
window.addEventListener('orientationchange', () => {
  dbgEvent('orient ' + viewportLine());
  onViewportChange(true);
});
// The visual viewport can move without a window resize firing at all, which
// would look exactly like this jump and leave no trace in the log otherwise.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => dbgEvent('vv-resize ' + viewportLine()));
  window.visualViewport.addEventListener('scroll', () => dbgEvent('vv-scroll ' + viewportLine()));
}
// A shrink that outlasts LAYOUT_SETTLE_MS fires no further resize event of its
// own, so it needs looking at again rather than waiting to be told.
setInterval(() => { if (shrinkSince) onViewportChange(false); }, 500);
latchLayout(true);
resizeCanvas();
drawKaleidoscope();

const cursorDot = document.getElementById('cursorDot');

// No Pointer Lock, and nothing standing in for it. b16-b23 measured the lock on
// this tablet and it does not work here: it drops itself unprompted, and around
// ninety percent of the movement delivered under it cancels out.
//
// Everything it was wanted for came from one requirement -- that an idle reset
// to the middle survive the next movement -- and meeting that without the
// ability to relocate the real pointer is what produced the anchor (b12), the
// cap (b26) and the slack (b27-b28), each fixing the last one's side effect.
// b29 drops the requirement instead: the idle reset moves the source and its
// targets rather than the view, so the pointer never has to be anywhere it
// isn't. pan is the pointer, and that is the whole mapping.
//
// cursorDot is the cursor inside the disc, where the real one is hidden, and it
// sits at the clamped pan -- so it rests on the rim while the OS cursor carries
// on outside, each visible exactly where the other is not.

function updateCursorDotPosition() {
  cursorDot.style.left = (pan.x / SRC_SIZE) * 100 + '%';
  cursorDot.style.top = (pan.y / SRC_SIZE) * 100 + '%';
  applyDotPush();
}

// Scale rather than size, so it grows about its own centre and stays exactly on
// the rim; the halo widens with it so the cue carries at arm's length.
function applyDotPush() {
  if (rimPush === dotPushApplied) return;
  dotPushApplied = rimPush;
  const hex = cursorColor || DEFAULT_CURSOR_COLOR;
  cursorDot.style.transform = 'scale(' + (1 + rimPush * 0.85).toFixed(3) + ')';
  cursorDot.style.boxShadow = '0 0 0 2px rgba(0,0,0,0.55), 0 0 '
    + Math.round(10 + rimPush * 22) + 'px ' + hex;
}

// The dot marks pan, which is clamped to the disc; the OS cursor marks where
// the hand actually is, which can be anywhere. Inside the circle they would sit
// on top of each other, so the real one is hidden there and handed back the
// moment the pointer leaves the disc -- which is also the only time it says
// anything the dot cannot.
let cursorHidden = null;
// The OS cursor stays hidden for a margin past the rim as well, not just inside
// it. Crossing the edge is not a moment worth marking: the dot is already
// pinned to the rim there and the view has stopped moving, so handing back a
// second cursor the instant the pointer leaves only draws the eye to the seam.
// Confirmed on the tablet at 1.1 and asked to reach further, so a quarter of a
// radius. The ceiling is 1.41, where the halo would swallow the corners of the
// stage box and there would be nowhere inside it left showing an OS cursor at
// all; 1.25 keeps the corners clear with room to spare.
const CURSOR_HIDE_MARGIN = 1.25;

function updateCursorVisibility(e) {
  const rect = stage.getBoundingClientRect();
  const dx = e.clientX - (rect.left + rect.width / 2);
  const dy = e.clientY - (rect.top + rect.height / 2);
  const inside = Math.hypot(dx, dy) <= (rect.width / 2) * CURSOR_HIDE_MARGIN;
  if (inside === cursorHidden) return;
  cursorHidden = inside;
  // Both the stage and the body, because the margin reaches outside the stage:
  // the circle is inscribed in its box, so at 1.1 radii the halo pokes past the
  // box edge at top, bottom, left and right, where the stage's own cursor rule
  // no longer applies. The corners of the box sit at 1.41 radii and so stay
  // outside the halo, which is where the OS cursor is wanted anyway.
  if (inside) {
    stage.style.cursor = 'none';
    document.body.style.cursor = 'none';
  } else {
    applyCssCursor(cursorColor || DEFAULT_CURSOR_COLOR);
    document.body.style.cursor = '';
  }
}

function applyCssCursor(hex) {
  stage.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='${encodeURIComponent(hex)}' stroke='%23000000' stroke-opacity='0.55' stroke-width='1.5'/></svg>") 10 10, pointer`;
}

// Gain keeps the real pointer away from the edges of the screen. The circle is
// 94vmin, so on a landscape tablet it is 94% of the screen height, and mapping
// it 1:1 meant reaching the top of the circle required the pointer to be within
// a few percent of the top of the screen -- far enough into Android's reveal
// zone to pull the system bars down over the app. At a gain of 1.6 the pointer
// covers the whole circle from within the middle ~62% of the screen.
const POINTER_GAIN = 1.6;

// Coordinates outside the stage map outside 0..SRC_SIZE quite happily; they get
// clamped back onto the circle afterwards.
//
// KNOWN WRONG, not yet fixed. This maps against the stage rect -- the circle's
// own bounding box -- when it should map against the width and height of the
// screen. Everything the pointer does beyond the circle is dead travel: move up
// past the rim and back down again and the view does not move at all until the
// pointer is back inside, and nothing on screen explains why, since the dot is
// pinned to the rim the whole time. The gain makes it worse rather than better,
// because it brings the rim within the middle ~62% of the screen and leaves the
// remaining 38% as dead band on every side.
//
// Mapping the viewport onto the circle instead would remove the dead travel
// entirely, at the cost of the edge-avoidance the gain was added for: the
// pointer would have to reach the screen edges again to reach the rim, which is
// what pulls Android's system bars down over the app. Worth measuring both
// before choosing.
function baseFromEvent(e) {
  const rect = stage.getBoundingClientRect();
  const half = SRC_SIZE / 2;
  const x = ((e.clientX - rect.left) / rect.width) * SRC_SIZE;
  const y = ((e.clientY - rect.top) / rect.height) * SRC_SIZE;
  return {
    x: half + (x - half) * POINTER_GAIN, // scaled about the circle's center, so
    y: half + (y - half) * POINTER_GAIN, // the middle still maps to the middle
  };
}

// pan is the pointer, and nothing else. No offset, no delta, no accumulator --
// so every point of the circle is reachable from every pointer position, at
// every moment, and there is no state to get out of step with the hand.
function applyMapping(base) {
  pan.x = base.x;
  pan.y = base.y;
  clampPanToCircle();
  requestDraw();
}

// The stage is a circle inscribed in its square bounding box, so the movable
// area is a circle of radius SRC_SIZE/2 around the box's center -- clamping
// pan to the square (as before) let the cursor wander into the box's
// corners, visibly outside the ring. All 4 pattern targets sit within this
// radius, so they stay reachable.
// How far past the rim the pointer is pushing, 0..1.
//
// Beyond the rim pan is clamped, so the view stops dead -- and stopping dead is
// indistinguishable from the app having frozen, which is what makes someone push
// harder, toward the edge of the screen, which is what summons Android's system
// bars. The dot swells and brightens instead, so the stillness reads as the edge
// of the picture rather than as a fault, and there is no reason to keep going.
const RIM_PUSH_FULL = 110;    // source units of overshoot for the full effect
let rimPush = 0;

function clampPanToCircle() {
  const cx = SRC_SIZE / 2, cy = SRC_SIZE / 2;
  const dx = pan.x - cx, dy = pan.y - cy;
  const dist = Math.hypot(dx, dy);
  const maxR = SRC_SIZE / 2;
  rimPush = Math.min(1, Math.max(0, (dist - maxR) / RIM_PUSH_FULL));
  if (dist > maxR) {
    const scale = maxR / dist;
    pan.x = cx + dx * scale;
    pan.y = cy + dy * scale;
  }
}

// On window for the same reason, and because a press that lands outside the
// box otherwise left the readout showing "input -" with no way to tell a
// dead device from an unlistened corner of the page.
// The manifest asks for display: fullscreen, which hides Android's bars. An
// install still carrying an older manifest comes up merely standalone, and for
// that the Fullscreen API gets to the same place -- but only from inside a user
// gesture, so the first press is where it has to be asked for. Never attempted
// in a browser tab, where taking the whole screen unasked would be obnoxious.
function enterFullscreenIfStandalone() {
  if (!matchMedia('(display-mode: standalone)').matches) return;
  if (document.fullscreenElement) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    const p = req.call(el, { navigationUI: 'hide' });
    if (p && typeof p.catch === 'function') p.catch(() => {});
    dbgEvent('fullscreen requested');
  } catch (err) {
    dbgEvent('fullscreen failed');
  }
}

window.addEventListener('pointerdown', e => {
  dbg.lastType = e.pointerType;
  dbgEvent('down (' + e.pointerType + ')');
  enterFullscreenIfStandalone();
});


// A mouse reports movement far more often than the screen refreshes (125-1000
// Hz against 60-120 Hz), and every draw is a full repaint of the whole circle.
// Drawing straight from the event handler meant several full repaints per
// displayed frame, so the input queue fell behind and the dot moved in jerks --
// worst in the installed PWA, where the canvas is largest. The handler now only
// updates pan and asks for a single draw per animation frame.
let drawFrameId = null;

function renderNow() {
  drawKaleidoscope();
  updateMatch();
  updateCursorDotPosition();
}

function requestDraw() {
  if (drawFrameId !== null) return;
  drawFrameId = requestAnimationFrame(() => {
    drawFrameId = null;
    renderNow();
  });
}

// One listener, one mapping: the pointer's position on the stage is the pan,
// directly. There is no delta path and no anchor, so every point of the circle
// is reachable at every moment and nothing accumulates between events.

// applyMapping has already clamped and asked for the draw; all that is left is
// to say the app was touched. A reshuffle in flight is deliberately not
// cancelled: it is the source that is moving, not the view, so it costs the
// visitor no control, and stopping it half way could leave an offset that puts
// a target outside the disc.
function trackMove() {
  noteActivity();
}

// Listened for on window rather than the stage: the stage is a disc inside a
// square box, so movement through its corners, or over the page around it, has
// to count too -- otherwise the view sits still while the trackball is plainly
// being moved. Coordinates outside the box map outside 0..SRC_SIZE quite
// happily; clampPanToCircle puts them back on the rim afterwards.
window.addEventListener('pointermove', e => {
  dbg.absMoves++;
  if (e.buttons) dbg.dragMoves++; else dbg.hoverMoves++;
  dbg.buttons = e.buttons;
  dbg.lastHandler = 'pointermove (absolute)';
  dbg.lastType = e.pointerType;
  dbg.clientX = e.clientX; dbg.clientY = e.clientY;

  const base = baseFromEvent(e);
  applyMapping(base);
  updateCursorVisibility(e);
  trackMove();
});

// After 20s with no pointer activity the mapping is re-registered: the whole
// source, and every target with it, slides to a new offset underneath a pointer
// that does not move.
//
// The point of the idle reset was never to put the view back in the middle. It
// was to stop the next visitor walking up to a clue the last one had already
// found, still sitting where they left it. Moving the answers does that, and
// unlike moving the view it asks nothing of a cursor the app has no way to
// relocate -- which is what Pointer Lock, then the anchor, then the slack were
// all for. None of them are needed to reset a puzzle whose reset does not
// involve the pointer.
const IDLE_RESET_MS = 20000;
const IDLE_CHECK_MS = 500;
const RESHUFFLE_MS = 1400;

// Two things a new offset has to satisfy. Every target must stay inside the
// disc, or a clue becomes unfindable; and none may land where the pointer was
// left standing, or the reset hands the next visitor an answer instead of
// taking one away.
//
// The second number comes from the reveal threshold, not from taste. proximity
// is 1 - dist/500 and letters begin to appear at 0.90, so a word is only ever
// legible within 50 of its target. 160 is more than three times that: far
// enough that arriving and nudging the trackball cannot uncover anything, close
// enough to leave the offsets feasible. Asking for 300 is not a stricter
// version of the same idea -- it is unsatisfiable, since an exclusion disc that
// size around the pointer cannot be cleared by all four targets at once while
// they stay in the circle. Measured over a grid of every translation:
//
//   margin 430, away 300:  0 usable        <- what b29 first asked for
//   margin 430, away 220:  0.1% usable
//   margin 430, away 160:  5.5% usable     <- chosen
//
// If even that finds nothing from where the pointer happens to be, the second
// pass drops the away test and takes any offset that keeps the clues findable:
// a reset that moves the answers somewhere is worth more than one that gives up
// and leaves them exactly where they were.
const TARGET_MARGIN = 430;
const MIN_AWAY_FROM_POINTER = 160;

let reshuffleAnimId = null;
let lastActivityAt = performance.now();
let reshuffledSinceActivity = false;

function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// Where a target ends up, in pan coordinates, for a given offset. The source
// tiles, so this wraps rather than running off the edge.
function targetFor(p, offset) {
  return {
    x: modSrc(p.target.x - offset.x),
    y: modSrc(p.target.y - offset.y),
  };
}

function refreshTargets() {
  PATTERNS.forEach(p => { p.eff = targetFor(p, mapOffset); });
}

function offsetIsUsable(o, requireAway) {
  const c = SRC_SIZE / 2;
  return PATTERNS.every(p => {
    const t = targetFor(p, o);
    if (Math.hypot(t.x - c, t.y - c) > TARGET_MARGIN) return false;
    if (requireAway && Math.hypot(t.x - pan.x, t.y - pan.y) < MIN_AWAY_FROM_POINTER) return false;
    return true;
  });
}

function pickOffset() {
  for (const requireAway of [true, false]) {
    for (let tries = 0; tries < 300; tries++) {
      const o = { x: Math.random() * SRC_SIZE, y: Math.random() * SRC_SIZE };
      if (offsetIsUsable(o, requireAway)) return o;
    }
  }
  return null; // only if the targets cannot be fitted at all
}

function reshuffleMapping() {
  const to = pickOffset();
  if (!to) {
    dbgEvent('reshuffle: no usable offset');
    return;
  }
  dbg.reshuffles++;
  dbgEvent('reshuffle mapping');
  const fromX = mapOffset.x, fromY = mapOffset.y;
  const startTime = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / RESHUFFLE_MS);
    const e = easeInOutQuad(t);
    mapOffset.x = fromX + (to.x - fromX) * e;
    mapOffset.y = fromY + (to.y - fromY) * e;
    refreshTargets();
    renderNow();
    if (t < 1) {
      reshuffleAnimId = requestAnimationFrame(step);
    } else {
      reshuffleAnimId = null;
    }
  }
  reshuffleAnimId = requestAnimationFrame(step);
}

// Idleness is measured against a timestamp polled twice a second, rather than a
// timeout torn down and recreated on every single pointer event.
function noteActivity() {
  lastActivityAt = performance.now();
  reshuffledSinceActivity = false;
}

// Any pointer activity in the window counts, not only movement over the circle.
// The stage is a disc inside a square box, so passing through its corners -- or
// over the page around it -- fires no stage pointermove at all.
['pointermove', 'pointerdown', 'wheel', 'keydown'].forEach(type => {
  window.addEventListener(type, noteActivity, { passive: true });
});

setInterval(() => {
  if (reshuffledSinceActivity || reshuffleAnimId !== null) return;
  if (performance.now() - lastActivityAt >= IDLE_RESET_MS) {
    reshuffledSinceActivity = true; // one reshuffle per idle stretch
    reshuffleMapping();
  }
}, IDLE_CHECK_MS);

/* ---------- 4. Pattern matching: drives the ring's color/glow and the hidden word ---------- */
const PATTERNS = [
  // image is named rather than derived from word: the files were renamed to
  // ASCII so sw.js can precache them, and the two no longer match.
  { id: 'Oheň',   word: 'Zrcadlo', image: 'zrcadlo.png', color: '#ff8a3d', glow: 'rgba(255,138,61,0.55)', target: { x: 444, y: 370 } },
  { id: 'Země',   word: 'Jeskyně', image: 'jeskyne.png', color: '#7cc36a', glow: 'rgba(124,195,106,0.55)', target: { x: 738, y: 481 } },
  { id: 'Voda',   word: 'Spirála', image: 'spirala.png', color: '#4aa8f0', glow: 'rgba(74,168,240,0.55)',  target: { x: 158, y: 608 } },
  { id: 'Vzduch', word: 'Kyvadlo', image: 'kyvadlo.png', color: '#9fd0d6', glow: 'rgba(159,208,214,0.55)', target: { x: 72, y: 231 } },
];
const ACTIVE_THRESHOLD = 0.05; // below this proximity, no pattern is "active" (overlay stays empty)
const REVEAL_START = 0.90;   // proximity at which the first letters appear
const REVEAL_FULL  = 0.98;   // proximity at which the whole word is visible

// Build a "diametrically opposite" reveal order: pair each letter with the
// one exactly half the word-length away (i <-> i+len/2), like opposite points
// on a circle. Reveal starts one step in from that seam and saves the pair
// containing the true first letter (and, for odd lengths, the true last
// letter) for last. E.g. for "Kalamita" (len 8): [1,5,2,6,3,7,0,4] -- "a i",
// "l t", "a a", then "K m" last.
function genRevealOrder(len) {
  if (len <= 1) return len === 1 ? [0] : [];
  const half = Math.floor(len / 2);
  const order = [];
  for (let i = 1; i < half; i++) {
    order.push(i, i + half);
  }
  order.push(0, half);
  if (len % 2 === 1) order.push(len - 1);
  return order;
}
PATTERNS.forEach(p => {
  p.revealOrder = genRevealOrder(p.word.length);
});
refreshTargets(); // identity until the first idle reset, but never undefined

/* ---------- 4a. The clue picture ---------- */
// Each pattern has a drawing that arrives with its word: it starts appearing as
// the first letters light and is complete when the last one lands, materialising
// through a coarse ordered dither.
//
// The artwork ships as white-on-transparent (tools/obrazce-alpha.js puts the
// drawing in the alpha channel), so it can be filled with the pattern colour the
// same way the letters are, and carries the same glow.
const CLUE_BOX = 0.52;        // share of the disc the square art box spans
// Steps from the first letter to the last. Sixteen was inherited from the 4x4
// Bayer matrix that used to supply the thresholds; nothing needs it now, and at
// a third of the shard size sixteen steps uncovered too much at once.
const CLUE_LEVELS = 48;
// The letters carry four shadows and only one is the coloured glow; the other
// three are black, and they are what lifts the word off a moving kaleidoscope.
// b32 baked the glow alone, which on thin line art comes to almost nothing.
//
// This is that stack, retuned. The letters' numbers assume thick glyphs: spread
// over a 2px stroke the same blur thins the shadow out until it barely reads, so
// the two inner shadows are tighter and each is drawn more than once, which
// accumulates alpha into an outline that actually hugs the line. Drawn back to
// front, the order CSS paints a text-shadow list in.
//
//   letters: 0 0 26px <glow>, 0 0 12px #000, 0 4px 8px #000e6, 0 10px 22px #000d9
const CLUE_SHADOWS = [
  { blur: 22, y: 10, color: 'rgba(0,0,0,0.85)', times: 1 }, // the soft drop
  { blur: 9,  y: 4,  color: 'rgba(0,0,0,0.95)', times: 2 },
  { blur: 5,  y: 0,  color: 'rgba(0,0,0,1)',    times: 3 }, // the outline
  { blur: 26, y: 0,  glow: true,                 times: 2 }, // the pattern colour
];
// Room for the largest of them, 22px of blur thrown 10px down.
const CLUE_PAD = 34;
const MAX_CLUE_PX = 700;      // same bargain as MAX_CANVAS_PX: sharpness nobody sees

// The picture is cut into shards, each with a number saying how late it
// arrives; a level uncovers every shard numbered below it.
//
// Until b35 the shards were squares on a fixed grid, and a grid is the first
// thing the eye finds -- even with the arrival order clumped, every piece was
// the same little square in the same row as its neighbours. They are now
// Voronoi cells around scattered seeds: each shard an irregular polygon, no two
// alike, with no row or column left to line them up.
//
// The seeds sit on a grid but are thrown off it by CLUE_SEED_JITTER, which is
// what makes the shards irregular while keeping them roughly one size. Staying
// near their slots is also what makes this cheap: a pixel finds its shard by
// checking the nine seeds around it rather than all nine hundred.
//
// The arrival numbers come from smooth value noise, so neighbouring shards
// arrive at similar times and the picture surfaces in drifting patches;
// CLUE_SPLATTER mixes independent randomness back in to fray the patch edges.
// The field is then rank-normalised -- shards sorted and renumbered by their
// place in that order -- so level L uncovers exactly L/16 of them however the
// noise fell. Clumped in appearance, even in pace, and the pace is what keeps
// it in step with the letters.
const CLUE_SHARD = 7;         // average shard across, in CSS px
const CLUE_SEED_JITTER = 0.8; // 0 pins every seed to its slot centre, 1 lets it reach the edge
const CLUE_MASK_STEP = 2;     // mask resolution in CSS px -- how finely a shard edge is cut
const CLUE_LATTICE = 5;       // shards per noise step -- bigger, slower-drifting clouds
const CLUE_SPLATTER = 0.38;   // 0 = smooth clouds, 1 = pure static
let clueField = null;         // { mw, mh, owner, rank }

const clueCanvas = document.getElementById('clue');
const clueCtx = clueCanvas.getContext('2d');
const clueBuf = document.createElement('canvas');   // art is composed here, then glowed onto the visible one
const clueBufCtx = clueBuf.getContext('2d');
const clueMaskCanvas = document.createElement('canvas'); // one pixel per mask step
let clueScale = 1;            // canvas pixels per CSS pixel
let cluePattern = null;
let clueLevel = 0;
let clueDrawn = '';           // what is actually on the canvas, so a redraw can be skipped

// Smooth value noise over a coarse lattice.
function latticeNoise(lat, lx, gx, gy) {
  const fx = gx / CLUE_LATTICE, fy = gy / CLUE_LATTICE;
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx - x0, ty = fy - y0;
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = lat[y0 * lx + x0], b = lat[y0 * lx + x0 + 1];
  const c = lat[(y0 + 1) * lx + x0], d = lat[(y0 + 1) * lx + x0 + 1];
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

function buildClueField() {
  const w = clueCanvas.width, h = clueCanvas.height;
  const cell = Math.max(3, Math.round(CLUE_SHARD * clueScale));
  const gx = Math.ceil(w / cell) + 1, gy = Math.ceil(h / cell) + 1;
  const seeds = gx * gy;
  if (!(w > 0) || !(seeds > 0)) { clueField = null; return; }

  const lx = Math.ceil(gx / CLUE_LATTICE) + 2, ly = Math.ceil(gy / CLUE_LATTICE) + 2;
  const lat = new Float32Array(lx * ly);
  for (let k = 0; k < lat.length; k++) lat[k] = Math.random();

  const seedX = new Float32Array(seeds), seedY = new Float32Array(seeds);
  const val = new Float32Array(seeds);
  for (let j = 0; j < gy; j++) {
    for (let i = 0; i < gx; i++) {
      const k = j * gx + i;
      seedX[k] = (i + 0.5 + (Math.random() - 0.5) * CLUE_SEED_JITTER) * cell;
      seedY[k] = (j + 0.5 + (Math.random() - 0.5) * CLUE_SEED_JITTER) * cell;
      val[k] = latticeNoise(lat, lx, i, j) * (1 - CLUE_SPLATTER) + Math.random() * CLUE_SPLATTER;
    }
  }

  const rank = new Float32Array(seeds);
  const idx = new Array(seeds);
  for (let k = 0; k < seeds; k++) idx[k] = k;
  idx.sort((p, q) => val[p] - val[q]);
  for (let r = 0; r < seeds; r++) rank[idx[r]] = r / seeds;

  // Which shard owns each mask pixel. Only the nine seeds around it can win,
  // since none has strayed beyond its own slot.
  const step = Math.max(1, Math.round(CLUE_MASK_STEP * clueScale));
  const mw = Math.ceil(w / step), mh = Math.ceil(h / step);
  const owner = new Uint32Array(mw * mh);
  for (let my = 0; my < mh; my++) {
    const py = (my + 0.5) * step;
    const cj = Math.min(gy - 1, Math.floor(py / cell));
    for (let mx = 0; mx < mw; mx++) {
      const px = (mx + 0.5) * step;
      const ci = Math.min(gx - 1, Math.floor(px / cell));
      let best = 0, bestD = Infinity;
      for (let dj = -1; dj <= 1; dj++) {
        const j = cj + dj;
        if (j < 0 || j >= gy) continue;
        for (let di = -1; di <= 1; di++) {
          const i = ci + di;
          if (i < 0 || i >= gx) continue;
          const k = j * gx + i;
          const ddx = px - seedX[k], ddy = py - seedY[k];
          const d = ddx * ddx + ddy * ddy;
          if (d < bestD) { bestD = d; best = k; }
        }
      }
      owner[my * mw + mx] = best;
    }
  }

  clueField = { mw, mh, owner, rank };
}

// One pixel per mask step, scaled up with smoothing off, so a shard keeps a
// hard cut edge rather than being blurred back into the background.
function clueMask(level) {
  const { mw, mh, owner, rank } = clueField;
  clueMaskCanvas.width = mw;
  clueMaskCanvas.height = mh;
  const mctx = clueMaskCanvas.getContext('2d');
  const img = mctx.createImageData(mw, mh);
  const cut = level / CLUE_LEVELS;
  for (let k = 0; k < mw * mh; k++) {
    img.data[k * 4] = 255;
    img.data[k * 4 + 1] = 255;
    img.data[k * 4 + 2] = 255;
    img.data[k * 4 + 3] = rank[owner[k]] < cut ? 255 : 0;
  }
  mctx.putImageData(img, 0, 0);
  return clueMaskCanvas;
}

function composeClue(pattern, level) {
  const w = clueCanvas.width, h = clueCanvas.height;
  clueCtx.clearRect(0, 0, w, h);
  if (!pattern || !pattern.imageReady || level <= 0 || !clueField) return;

  clueBuf.width = w;          // assigning the size also clears it
  clueBuf.height = h;

  // Fit inside the box, leaving room for the glow so it is not clipped.
  const img = pattern.img;
  const pad = CLUE_PAD * clueScale;
  const scale = Math.min((w - pad * 2) / img.naturalWidth, (h - pad * 2) / img.naturalHeight);
  if (!(scale > 0)) return; // a canvas too small to hold the glow, or a zero-sized image
  const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
  clueBufCtx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);

  // Keep only the shards this level has uncovered.
  clueBufCtx.globalCompositeOperation = 'destination-in';
  clueBufCtx.imageSmoothingEnabled = false;
  clueBufCtx.drawImage(clueMask(level), 0, 0, w, h);

  // Tint whatever survived. The art is white, so this is the whole colouring.
  clueBufCtx.globalCompositeOperation = 'source-in';
  clueBufCtx.fillStyle = pattern.color;
  clueBufCtx.fillRect(0, 0, w, h);
  clueBufCtx.globalCompositeOperation = 'source-over';

  // Baked in rather than applied as a CSS filter on the element: a filter
  // re-rasterises on every frame, and the kaleidoscope behind this repaints
  // continuously.
  //
  // Each pass paints the art as well as its shadow, which is harmless -- the
  // copies land exactly on top of each other and the last pass, drawn with no
  // shadow at all, is what the eye ends up seeing.
  for (const sh of CLUE_SHADOWS) {
    clueCtx.shadowColor = sh.glow ? pattern.glow : sh.color;
    clueCtx.shadowBlur = sh.blur * clueScale;
    clueCtx.shadowOffsetY = sh.y * clueScale;
    for (let i = 0; i < sh.times; i++) clueCtx.drawImage(clueBuf, 0, 0);
  }
  clueCtx.shadowColor = 'transparent';
  clueCtx.shadowBlur = 0;
  clueCtx.shadowOffsetY = 0;
  clueCtx.drawImage(clueBuf, 0, 0);
}

function updateClue(pattern, level) {
  clueLevel = level;
  cluePattern = pattern;
  // imageReady is in the key so a picture that finishes loading late redraws.
  const key = (pattern ? pattern.id : '-') + ':' + level + ':' + (pattern && pattern.imageReady ? 1 : 0);
  if (key === clueDrawn) return;
  clueDrawn = key;
  composeClue(pattern, level);
}

function resizeClue() {
  const dpr = window.devicePixelRatio || 1;
  const cssSize = stage.clientWidth * CLUE_BOX;
  if (!(cssSize > 0)) return;
  const size = Math.min(MAX_CLUE_PX, Math.round(cssSize * dpr));
  if (size === clueCanvas.width) return;
  clueCanvas.width = clueCanvas.height = size;
  clueScale = size / cssSize;
  buildClueField();           // block size is in canvas pixels, so the field is stale
  clueDrawn = '';
  composeClue(cluePattern, clueLevel);
}

window.addEventListener('resize', resizeClue);
window.addEventListener('orientationchange', resizeClue);
resizeClue();

// Loaded up front so all four are warm long before anyone is near a clue. A
// missing file leaves the canvas empty and says so in the log rather than
// throwing -- the source texture has no error handler and a silent blank is
// exactly the failure that is worth not repeating.
PATTERNS.forEach(p => {
  const img = new Image();
  img.onload = () => {
    p.imageReady = true;
    if (p === cluePattern) updateClue(p, clueLevel);
  };
  img.onerror = () => dbgEvent('clue image missing: ' + p.image);
  img.src = 'Obrazce/' + p.image;
  p.img = img;
  p.imageReady = false;
});

const ring = document.getElementById('ring');
const wordOverlay = document.getElementById('wordOverlay');
let activePatternId = null; // which pattern's letters are currently rendered in the overlay

const DEFAULT_CURSOR_COLOR = '#ff8a3d';
let cursorColor = null; // tracks the last color applied, so we only touch style.cursor on change
let dotPushApplied = -1;      // so the shadow is only rewritten when it changes

function setCursorDotColor(hex) {
  if (hex === cursorColor) return;
  cursorColor = hex;
  cursorDot.style.background = hex;
  dotPushApplied = -1;        // the halo carries the colour, so it must be redrawn
  applyDotPush();
  if (cursorHidden !== true) applyCssCursor(hex); // never un-hide it mid-circle
}

function setActivePattern(pattern) {
  if (activePatternId === (pattern ? pattern.id : null)) return;
  activePatternId = pattern ? pattern.id : null;
  wordOverlay.innerHTML = '';
  // The picture leaves with the letters; updateWordReveal brings it back in. A
  // fresh field per approach, so the same clue does not spatter the same way
  // twice.
  buildClueField();
  updateClue(pattern, 0);
  if (!pattern) return;
  Array.from(pattern.word).forEach((ch, idx) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.dataset.idx = idx;
    span.textContent = ch;
    wordOverlay.appendChild(span);
  });
  const letters = Array.from(wordOverlay.querySelectorAll('.letter'));
  const mid = (letters.length - 1) / 2 || 1;
  letters.forEach((span, idx) => {
    const fontSize = parseFloat(getComputedStyle(span).fontSize) || 39;
    const amplitude = fontSize * 0.36; // "slight" U-shaped sag toward the center letters
    const t = (idx - (letters.length - 1) / 2) / mid;
    const curveY = amplitude * (1 - t * t);
    span.style.setProperty('--curve-y', curveY.toFixed(1) + 'px');
  });
}

function updateWordReveal(pattern, proximity) {
  const len = pattern.word.length;
  // 0 at REVEAL_START, 1 at REVEAL_FULL. Hoisted out of the middle branch so
  // the picture can be driven by the same ramp as the letters and the two
  // cannot drift apart.
  const t = Math.max(0, Math.min(1,
    (proximity - REVEAL_START) / (REVEAL_FULL - REVEAL_START)));
  let revealedCount;
  if (proximity >= REVEAL_FULL) {
    revealedCount = len;
  } else if (proximity >= REVEAL_START) {
    revealedCount = Math.min(len, 2 + Math.floor(t * (len - 2)));
  } else {
    revealedCount = 0;
  }

  // Level 1 the moment the first letters light, 16 when the last one does, so
  // the picture and the word finish together. Nothing at all below that.
  updateClue(pattern, revealedCount === 0 ? 0 : 1 + Math.round(t * (CLUE_LEVELS - 1)));
  const litIndices = new Set(pattern.revealOrder.slice(0, revealedCount));
  Array.from(wordOverlay.querySelectorAll('.letter')).forEach(el => {
    const idx = Number(el.dataset.idx);
    el.classList.toggle('lit', litIndices.has(idx));
  });
}

function updateMatch() {
  let best = null, bestProximity = -1;
  PATTERNS.forEach(p => {
    const t = p.eff || p.target; // shifted by whatever the last idle reset chose
    const dist = Math.hypot(pan.x - t.x, pan.y - t.y);
    const proximity = Math.max(0, 1 - dist / 500);
    if (proximity > bestProximity) {
      bestProximity = proximity;
      best = p;
    }
  });

  if (best && bestProximity >= ACTIVE_THRESHOLD) {
    setActivePattern(best);
    stageWrap.style.setProperty('--ring-color', best.color);
    stageWrap.style.setProperty('--ring-glow', best.glow);
    ring.style.opacity = bestProximity > 0.15 ? (bestProximity * 0.9).toFixed(2) : 0;
    updateWordReveal(best, bestProximity);
    setCursorDotColor(best.color);
  } else {
    setActivePattern(null);
    ring.style.opacity = 0;
    setCursorDotColor(DEFAULT_CURSOR_COLOR);
  }
}
updateMatch();

if ('serviceWorker' in navigator) {
  // updateViaCache: 'none' stops the browser serving sw.js itself out of its
  // HTTP cache, which is what let a stale worker survive repeated relaunches.
  // update() then forces a check on every launch rather than waiting for the
  // browser's own schedule -- this runs as a kiosk, so it is never reloaded by
  // hand and would otherwise sit on one build indefinitely.
  const hadController = !!navigator.serviceWorker.controller;
  let reloadedForUpdate = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // A new worker took over, so the page now in front of us is the old one.
    // Only on an update, never on the first install, which would loop.
    if (!hadController || reloadedForUpdate) return;
    reloadedForUpdate = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update())
      .catch(() => {});
  });
}

</script>
</body>
</html>
